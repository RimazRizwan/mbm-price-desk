<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBM Price Desk — Product Lookup &amp; Order Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F22;
    --steel:#48586B;
    --steel-light:#7C8AA0;
    --concrete:#EDEBE6;
    --concrete-dark:#DEDBD3;
    --paper:#FFFFFF;
    --yellow:#F2B705;
    --yellow-dark:#C99200;
    --red:#C1432A;
    --green:#2E7D4F;
    --line:#CFCBC1;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--concrete);
    color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Archivo',sans-serif;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink);
    color:var(--concrete);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:30;
    border-bottom:3px solid var(--yellow);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand-name{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:0.02em;
  }
  .brand-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--steel-light);
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .stock-count{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--yellow);
    white-space:nowrap;
    margin-right:4px;
  }
  .topbar-btn{
    background:transparent;
    color:var(--concrete);
    border:1.5px solid var(--steel);
    padding:7px 12px;
    border-radius:var(--radius);
    font-weight:700;
    font-size:0.78rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .topbar-btn:hover{border-color:var(--yellow);color:var(--yellow);}
  .topbar-btn.accent{
    background:var(--yellow);
    color:var(--ink);
    border-color:var(--yellow);
  }
  .topbar-btn.accent:hover{background:var(--yellow-dark);border-color:var(--yellow-dark);color:var(--ink);}

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 1fr 360px;
    gap:0;
    max-width:1400px;
    margin:0 auto;
    align-items:start;
  }
  @media (max-width: 880px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- Search column ---------- */
  .main-col{
    padding:22px 20px 100px 20px;
    min-width:0;
  }
  .search-wrap{
    position:sticky;
    top:64px;
    z-index:20;
    background:var(--concrete);
    padding:4px 0 14px 0;
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    font-family:'Archivo',sans-serif;
    font-size:1.05rem;
    font-weight:600;
    padding:15px 18px 15px 46px;
    border:2px solid var(--ink);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  .search-box input:focus{
    border-color:var(--yellow-dark);
    box-shadow:0 0 0 3px rgba(242,183,5,0.35);
  }
  .search-box svg{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke:var(--steel);
    pointer-events:none;
  }
  .search-hint{
    margin-top:8px;
    font-size:0.8rem;
    color:var(--steel);
  }
  .search-hint .mono{color:var(--steel);}

  /* ---------- Results ---------- */
  .results{
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--paper);
  }
  .result-row{
    display:grid;
    grid-template-columns: 56px 1fr 30px 96px 122px;
    grid-template-areas: "sr name edit price qty";
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    transition:background .12s ease;
  }
  .result-row:last-child{border-bottom:none;}
  .result-row.in-order{
    background:#FFFBEA;
  }
  .r-sr{
    grid-area:sr;
    font-size:0.72rem;
    color:var(--steel);
    letter-spacing:0.02em;
  }
  .r-name{
    grid-area:name;
    min-width:0;
    overflow-wrap:break-word;
  }
  .r-name-text{
    font-weight:600;
    font-size:0.94rem;
    line-height:1.3;
  }
  .r-name-meta{
    font-size:0.7rem;
    color:var(--steel-light);
    margin-top:2px;
  }
  .r-name-meta .unit-tag{
    display:inline-block;
    background:var(--concrete-dark);
    color:var(--steel);
    padding:1px 6px;
    border-radius:2px;
    font-weight:600;
    font-size:0.66rem;
    letter-spacing:0.02em;
  }
  .r-edit{
    grid-area:edit;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--steel-light);
    font-size:0.95rem;
    padding:4px;
    line-height:1;
  }
  .r-edit:hover{color:var(--ink);}
  .r-price{
    grid-area:price;
    font-size:0.94rem;
    font-weight:600;
    text-align:right;
    white-space:nowrap;
  }
  .r-price.no-price{
    color:var(--steel-light);
    font-weight:500;
    font-size:0.78rem;
    font-style:normal;
  }
  .stepper{
    grid-area:qty;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
  }
  .stepper button{
    width:26px;
    height:26px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    font-size:1rem;
    line-height:1;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .stepper button:hover{background:var(--ink);color:var(--paper);}
  .stepper button:disabled{opacity:0.35;cursor:not-allowed;}
  .stepper button.plus{background:var(--ink);color:var(--yellow);border-color:var(--ink);}
  .stepper button.plus:hover{background:var(--yellow-dark);color:var(--ink);}
  .stepper input{
    width:42px;
    height:26px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'JetBrains Mono',monospace;
    font-size:0.85rem;
    font-weight:600;
    padding:0;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  /* ---------- Swipe-to-delete (products you've added) ---------- */
  .swipe-wrap{
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .swipe-wrap:last-child{border-bottom:none;}
  .swipe-wrap .swipe-content{
    border-bottom:none;
  }
  .swipe-delete-bg{
    position:absolute;
    top:0;right:0;bottom:0;
    width:90px;
    background:var(--red);
    display:flex;
    align-items:stretch;
  }
  .swipe-delete-btn{
    flex:1;
    background:none;
    border:none;
    color:#fff;
    font-weight:700;
    font-size:0.82rem;
    cursor:pointer;
  }
  .swipe-content{
    position:relative;
    background:var(--paper);
    transform:translateX(0);
    touch-action:pan-y;
  }
  .swipe-content.swipe-anim{
    transition:transform .18s ease;
  }
  .swipe-content.open{
    transform:translateX(-90px);
  }

  .no-results, .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--steel);
  }
  .empty-state{
    padding:56px 20px;
  }
  .empty-state svg{width:40px;height:40px;stroke:var(--steel-light);margin-bottom:12px;}
  .empty-state h2{
    font-size:1rem;
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .empty-state p{margin:0;font-size:0.88rem;}

  .truncated-note{
    padding:10px 14px;
    font-size:0.78rem;
    color:var(--steel);
    background:var(--concrete-dark);
    border-top:1px solid var(--line);
  }

  /* ---------- Column headers ---------- */
  .col-headers{
    display:grid;
    grid-template-columns: 56px 1fr 30px 96px 122px;
    gap:10px;
    padding:0 14px 8px 14px;
    font-size:0.7rem;
    color:var(--steel);
    font-weight:600;
    letter-spacing:0.02em;
  }
  .col-headers .ch-price{text-align:right;}
  .col-headers .ch-qty{text-align:right;}

  /* Mobile: stack rows so long names + steppers get room */
  @media (max-width: 640px){
    .result-row{
      grid-template-columns: 1fr auto auto;
      grid-template-areas:
        "name name edit"
        "sr sr price"
        "qty qty qty";
      row-gap:8px;
      column-gap:10px;
      padding:14px;
    }
    .r-sr{ align-self:center; }
    .r-price{ align-self:center; }
    .stepper{
      justify-content:stretch;
      width:100%;
    }
    .stepper button{
      width:38px;
      height:38px;
      font-size:1.15rem;
      flex:0 0 auto;
    }
    .stepper input{
      flex:1 1 auto;
      width:auto;
      max-width:90px;
      height:38px;
      font-size:1rem;
    }
    .col-headers{ display:none; }
  }

  /* ---------- Order ticket (right rail / desktop) ---------- */
  .ticket-col{
    padding:22px 20px 40px 0;
  }
  @media (max-width: 880px){
    .ticket-col{display:none;}
  }
  .ticket{
    position:sticky;
    top:64px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .ticket-top{
    background:var(--ink);
    color:var(--paper);
    padding:14px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .ticket-top h2{
    margin:0;
    font-size:0.88rem;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .ticket-top .count{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    color:var(--yellow);
  }
  .shop-name-row{
    padding:12px 16px;
    border-bottom:1px dashed var(--line);
    background:#FFFBEA;
  }
  .shop-name-row label{
    display:block;
    font-size:0.7rem;
    font-weight:700;
    color:var(--steel);
    margin-bottom:5px;
    letter-spacing:0.02em;
  }
  .shop-name-row input{
    width:100%;
    padding:8px 10px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-family:'Archivo',sans-serif;
    font-size:0.85rem;
    background:var(--paper);
    color:var(--ink);
  }
  .shop-name-row input:focus{outline:none;border-color:var(--yellow-dark);}
  .ticket-lines{
    max-height:calc(100vh - 420px);
    min-height:70px;
    overflow-y:auto;
    border-bottom:1px dashed var(--line);
  }
  .ticket-line{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    padding:10px 16px;
    border-bottom:1px solid var(--concrete-dark);
    font-size:0.82rem;
  }
  .tl-main{min-width:0;}
  .tl-name{font-weight:600;line-height:1.3;}
  .tl-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--steel);
    margin-top:2px;
  }
  .tl-total{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    white-space:nowrap;
  }
  .tl-remove{
    background:none;
    border:none;
    color:var(--steel-light);
    cursor:pointer;
    font-size:0.95rem;
    padding:0 0 0 4px;
    line-height:1;
  }
  .tl-remove:hover{color:var(--red);}
  .ticket-empty{
    padding:26px 16px;
    text-align:center;
    color:var(--steel);
    font-size:0.85rem;
  }
  .ticket-summary{
    padding:14px 16px;
  }
  .sum-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.8rem;
    color:var(--steel);
    margin-bottom:6px;
    gap:8px;
  }
  .sum-row.total{
    font-size:1.05rem;
    font-weight:800;
    color:var(--ink);
    margin-top:8px;
    padding-top:10px;
    border-top:2px solid var(--ink);
  }
  .sum-row.total .mono{font-family:'JetBrains Mono',monospace;}
  .discount-row{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .discount-row input[type="number"]{
    width:56px;
    height:26px;
    text-align:right;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    padding:0 4px;
  }
  .discount-row select{
    height:26px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'Archivo',sans-serif;
    font-size:0.75rem;
    background:var(--paper);
    color:var(--ink);
  }
  .ticket-note{
    font-size:0.72rem;
    color:var(--steel-light);
    margin-top:6px;
  }
  .ticket-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:0 16px 10px 16px;
  }
  .ticket-actions button{
    font-weight:700;
    font-size:0.8rem;
    padding:10px 8px;
    border-radius:var(--radius);
    cursor:pointer;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
  }
  .ticket-actions button.primary{
    background:var(--yellow);
    border-color:var(--ink);
  }
  .ticket-actions button.primary:hover{background:var(--yellow-dark);}
  .ticket-actions button.complete{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  .ticket-actions button.complete:hover{background:#245f3e;}
  .ticket-actions button:hover{background:var(--concrete-dark);}
  .ticket-actions button.full{grid-column:1/-1;}
  .clear-row{
    padding:0 16px 16px 16px;
  }
  .clear-row button{
    width:100%;
    background:none;
    border:none;
    color:var(--red);
    font-size:0.76rem;
    font-weight:600;
    cursor:pointer;
    padding:4px;
  }
  .clear-row button:hover{text-decoration:underline;}

  /* ---------- Mobile ticket bar ---------- */
  .mobile-ticket-bar{
    display:none;
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--ink);
    color:var(--paper);
    padding:12px 16px;
    align-items:center;
    justify-content:space-between;
    z-index:40;
    border-top:3px solid var(--yellow);
  }
  @media (max-width: 880px){
    .mobile-ticket-bar.visible{display:flex;}
  }
  .mtb-info{font-size:0.82rem;}
  .mtb-info .mono{color:var(--yellow);font-weight:700;}
  .mtb-btn{
    background:var(--yellow);
    color:var(--ink);
    border:none;
    font-weight:700;
    padding:9px 16px;
    border-radius:var(--radius);
    font-size:0.82rem;
    cursor:pointer;
  }

  /* ---------- Mobile sheet ---------- */
  .sheet-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(28,31,34,0.5);
    z-index:50;
  }
  .sheet-overlay.open{display:block;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    max-height:85vh;
    background:var(--paper);
    border-radius:14px 14px 0 0;
    display:flex;
    flex-direction:column;
    z-index:51;
    transform:translateY(100%);
    transition:transform .22s ease;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    padding:10px 0 4px 0;
    display:flex;
    justify-content:center;
  }
  .sheet-handle span{
    width:36px;height:4px;background:var(--line);border-radius:2px;display:block;
  }

  /* ---------- Generic modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(28,31,34,0.55);
    z-index:200;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--paper);
    border-radius:6px;
    max-width:440px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 12px 30px rgba(0,0,0,.3);
  }
  .modal-box.wide{max-width:640px;}
  .modal-head{
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .modal-head h3{margin:0;font-size:0.95rem;font-weight:700;}
  .modal-close{
    background:none;border:none;color:var(--concrete);
    font-size:1.2rem;cursor:pointer;line-height:1;padding:2px 6px;
  }
  .modal-close:hover{color:var(--yellow);}
  .modal-body{padding:18px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:0.76rem;
    font-weight:700;
    color:var(--steel);
    margin-bottom:5px;
    letter-spacing:0.02em;
  }
  .field input[type="text"], .field input[type="number"], .field select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-family:'Archivo',sans-serif;
    font-size:0.9rem;
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--yellow-dark);}
  .field-hint{font-size:0.7rem;color:var(--steel-light);margin-top:4px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:6px;
  }
  .modal-actions .left-actions{display:flex;gap:8px;}
  .btn{
    font-weight:700;
    font-size:0.82rem;
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
  }
  .btn:hover{background:var(--concrete-dark);}
  .btn.primary{background:var(--yellow);border-color:var(--ink);}
  .btn.primary:hover{background:var(--yellow-dark);}
  .btn.danger{background:var(--paper);border-color:var(--red);color:var(--red);}
  .btn.danger:hover{background:var(--red);color:#fff;}

  .filter-input{
    width:100%;
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-family:'Archivo',sans-serif;
    font-size:0.85rem;
    background:var(--paper);
    color:var(--ink);
  }
  .filter-input:focus{outline:none;border-color:var(--yellow-dark);}

  /* ---------- Report modal ---------- */
  .report-summary-bar{
    display:flex;
    gap:16px;
    padding:12px 18px;
    background:var(--concrete);
    border-bottom:1px solid var(--line);
    font-size:0.78rem;
    color:var(--steel);
    flex-wrap:wrap;
  }
  .report-summary-bar b{color:var(--ink);font-family:'JetBrains Mono',monospace;}
  .report-list{padding:10px 18px 18px 18px;}
  .report-entry{
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .report-entry-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    cursor:pointer;
    background:var(--paper);
    gap:10px;
  }
  .report-entry-head:hover{background:var(--concrete);}
  .re-date{font-size:0.82rem;font-weight:700;}
  .re-meta{font-size:0.72rem;color:var(--steel);margin-top:2px;}
  .re-total{font-family:'JetBrains Mono',monospace;font-weight:800;white-space:nowrap;}
  .report-entry-body{
    display:none;
    padding:10px 14px 14px 14px;
    border-top:1px solid var(--line);
    background:var(--concrete);
  }
  .report-entry.expanded .report-entry-body{display:block;}
  .re-line{
    display:flex;
    justify-content:space-between;
    font-size:0.78rem;
    padding:4px 0;
    border-bottom:1px dotted var(--line);
  }
  .re-line:last-child{border-bottom:none;}
  .re-line-name{flex:1;min-width:0;padding-right:8px;}
  .re-line-meta{font-family:'JetBrains Mono',monospace;color:var(--steel);white-space:nowrap;}

const state = {
  order: {},           // sr -> qty
  discount: { type: 'percent', value: 0 },
  shopName: '',          // shop/customer name for the order currently being built
  overrides: {},        // sr -> {price, buyRate, unit}

  editingSr: null,       // sr currently open in the product modal (null = adding new)
};

function loadAll(){
  try{ const raw = localStorage.getItem('mbm_order'); if(raw) state.order = JSON.parse(raw); }catch(e){}
  try{ const raw = localStorage.getItem('mbm_discount'); if(raw) state.discount = JSON.parse(raw); }catch(e){}
  try{ const raw = localStorage.getItem('mbm_shop_name'); if(raw !== null) state.shopName = raw; }catch(e){}
  try{ const raw = localStorage.getItem('mbm_product_overrides'); if(raw) state.overrides = JSON.parse(raw); }catch(e){}
  try{ const raw = localStorage.getItem('mbm_custom_products'); if(raw) state.customProducts = JSON.parse(raw); }catch(e){}
  try{ const raw = localStorage.getItem('mbm_order_history'); if(raw) state.history = JSON.parse(raw); }catch(e){}
}

/* ============================= CATALOG ENGINE ============================= */
// Merges the built-in price list with any buy-rate/unit/price overrides and
// any products added through "Add Product" into one lookup, keyed by sr.

let CATALOG = {};      // sr -> {sr, name, price, buyRate, unit, custom:bool}
let CATALOG_LIST = []; // flat array for searching, in catalog order
let nextCustomSr = 900001;

function rebuildCatalog(){
  CATALOG = {};
  CATALOG_LIST = [];

  PRODUCTS.forEach(p => {
    const [sr, name, price] = p;
    const ov = state.overrides[sr] || {};
    const item = {
      sr,
      name,
      price: (ov.price !== undefined && ov.price !== null) ? ov.price : price,
      buyRate: (ov.buyRate !== undefined) ? ov.buyRate : null,
      unit: ov.unit || 'Pcs',
      custom: false
    };
    CATALOG[sr] = item;
    CATALOG_LIST.push(item);
  });

  state.customProducts.forEach(cp => {
    const item = {
      sr: cp.sr,
      name: cp.name,
      price: cp.price,
      buyRate: (cp.buyRate === undefined) ? null : cp.buyRate,
      unit: cp.unit || 'Pcs',
      custom: true
    };
    CATALOG[cp.sr] = item;
    CATALOG_LIST.push(item);
    if(cp.sr >= nextCustomSr) nextCustomSr = cp.sr + 1;
  });
}

function fmtMoney(n){
  return 'Rs ' + n.toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtSr(sr){
  const s = String(sr);
  return s.length < 4 ? s.padStart(4,'0') : s;
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================= SEARCH & RESULTS ============================= */

const searchInput = document.getElementById('searchInput');
const resultsArea = document.getElementById('resultsArea');
const searchHint = document.getElementById('searchHint');
const MAX_RESULTS = 120;

function normalize(s){ return s.toUpperCase(); }

function search(query){
  const q = query.trim();
  if(q === ''){
    // No search yet — browse the full catalog in its original price-list order
    // (the same order it appears in your source PDF), with anything you've
    // added yourself appended at the end.
    return {matches: CATALOG_LIST, showEmpty:false, browsingAll:true};
  }
  const qUpper = normalize(q);
  const isNumeric = /^\d+$/.test(q);
  let matches = [];
  if(isNumeric){
    const exact = CATALOG[parseInt(q,10)];
    matches = CATALOG_LIST.filter(p => normalize(p.name).includes(qUpper) || String(p.sr) === q);
    if(exact){
      matches = matches.filter(p => p.sr !== exact.sr);
      matches.unshift(exact);
    }
  } else {
    matches = CATALOG_LIST.filter(p => normalize(p.name).includes(qUpper));
    matches.sort((a,b) => {
      const aStarts = normalize(a.name).startsWith(qUpper) ? 0 : 1;
      const bStarts = normalize(b.name).startsWith(qUpper) ? 0 : 1;
      if(aStarts !== bStarts) return aStarts - bStarts;
      return a.name.length - b.name.length;
    });
  }
  return {matches, showEmpty:false};
}

function qtyFor(sr){
  return state.order[sr] || 0;
}

function setQty(sr, qty){
  qty = Math.max(0, Math.min(9999, Math.floor(qty) || 0));
  if(qty === 0){
    delete state.order[sr];
  } else {
    state.order[sr] = qty;
  }
  saveOrder();
  renderTicket();
  document.querySelectorAll('.result-row[data-sr="'+sr+'"]').forEach(row=>{
    const input = row.querySelector('.qty-input');
    if(input) input.value = qty;
    row.classList.toggle('in-order', qty>0);
  });
  updateMobileBar();
}

function renderResults(){
  const {matches, showEmpty, browsingAll} = search(searchInput.value);

  if(showEmpty){
    resultsArea.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h2>No products yet</h2>
        <p>Use "+ Add Product" above to add your first item.</p>
      </div>`;
    searchHint.textContent = '';
    return;
  }

  if(matches.length === 0){
    resultsArea.innerHTML = `<div class="results"><div class="no-results">No products match that search. Try a shorter term, or use "+ Add Product" above to add it.</div></div>`;
    searchHint.textContent = '';
    return;
  }

  // When browsing the full A–Z list (no search typed yet), show everything —
  // otherwise cap search results for performance.
  const shown = browsingAll ? matches : matches.slice(0, MAX_RESULTS);

  searchHint.innerHTML = browsingAll
    ? `<span class="mono">${matches.length}</span> products, price-list order. Type to search.`
    : (matches.length > MAX_RESULTS
        ? `<span class="mono">${matches.length}</span> matches — showing top ${MAX_RESULTS}. Narrow your search to see more.`
        : `<span class="mono">${matches.length}</span> match${matches.length===1?'':'es'}`);

  const rows = shown.map(p => {
    const { sr, name, price, unit, custom } = p;
    const qty = qtyFor(sr);
    const priceHtml = price === null || price === undefined
      ? `<div class="r-price no-price mono">Call for price</div>`
      : `<div class="r-price mono">${fmtMoney(price)}</div>`;
    const disabled = (price === null || price === undefined) ? 'disabled' : '';
    const rowInner = `
        <div class="r-sr mono">#${fmtSr(sr)}</div>
        <div class="r-name">
          <div class="r-name-text">${escapeHtml(name)}</div>
          <div class="r-name-meta"><span class="unit-tag">${escapeHtml(unit)}</span>${custom ? ' · added by you' : ''}</div>
        </div>
        <button class="r-edit" onclick="openProductModal(${sr})" aria-label="Edit product" title="Edit">&#9998;</button>
        ${priceHtml}
        <div class="stepper">
          <button class="minus" ${disabled} onclick="setQty(${sr}, qtyFor(${sr})-1)" aria-label="Decrease quantity">−</button>
          <input class="qty-input mono" type="number" min="0" value="${qty}" ${disabled}
                 onchange="setQty(${sr}, this.value)" aria-label="Quantity">
          <button class="plus" ${disabled} onclick="setQty(${sr}, qtyFor(${sr})+1)" aria-label="Increase quantity">+</button>
        </div>`;

    if(custom){
      // Products you've added yourself can be swiped sideways to reveal a delete button.
      return `
      <div class="swipe-wrap">
        <div class="swipe-delete-bg">
          <button class="swipe-delete-btn" data-sr="${sr}">Delete</button>
        </div>
        <div class="swipe-content result-row ${qty>0?'in-order':''}" data-sr="${sr}" data-custom="true">${rowInner}
        </div>
      </div>`;
    }
    return `<div class="result-row ${qty>0?'in-order':''}" data-sr="${sr}">${rowInner}
      </div>`;
  }).join('');

  const truncatedNote = (!browsingAll && matches.length > MAX_RESULTS)
    ? `<div class="truncated-note">${matches.length - MAX_RESULTS} more matches not shown. Refine your search to narrow the list.</div>`
    : '';

  resultsArea.innerHTML = `
    <div class="col-headers">
      <div>SR#</div><div>PRODUCT</div><div></div><div class="ch-price">PRICE</div><div class="ch-qty">QTY</div>
    </div>
    <div class="results">
      ${rows}
      ${truncatedNote}
    </div>`;
}

/* ---------- Swipe-to-delete (for products you've added) ---------- */
let swipeState = null;

function closeAllSwipes(exceptEl){
  document.querySelectorAll('.swipe-content.open').forEach(el => {
    if(el !== exceptEl) el.classList.remove('open');
  });
}

resultsArea.addEventListener('touchstart', (e) => {
  const el = e.target.closest('.swipe-content');
  if(!el || el.dataset.custom !== 'true') return;
  closeAllSwipes(el);
  const t = e.touches[0];
  swipeState = {
    el,
    startX: t.clientX,
    startY: t.clientY,
    baseOffset: el.classList.contains('open') ? -90 : 0,
    currentX: 0,
    isHorizontal: null
  };
  el.classList.remove('swipe-anim');
}, {passive:true});

resultsArea.addEventListener('touchmove', (e) => {
  if(!swipeState) return;
  const t = e.touches[0];
  const dx = t.clientX - swipeState.startX;
  const dy = t.clientY - swipeState.startY;
  if(swipeState.isHorizontal === null){
    swipeState.isHorizontal = Math.abs(dx) > Math.abs(dy) + 4;
  }
  if(!swipeState.isHorizontal) return;
  e.preventDefault();
  let offset = swipeState.baseOffset + dx;
  offset = Math.max(-90, Math.min(0, offset));
  swipeState.currentX = offset;
  swipeState.el.style.transform = `translateX(${offset}px)`;
}, {passive:false});

resultsArea.addEventListener('touchend', () => {
  if(!swipeState) return;
  const { el, currentX, isHorizontal } = swipeState;
  el.classList.add('swipe-anim');
  el.style.transform = '';
  if(isHorizontal){
    el.classList.toggle('open', currentX < -45);
  }
  swipeState = null;
});

resultsArea.addEventListener('click', (e) => {
  const delBtn = e.target.closest('.swipe-delete-btn');
  if(delBtn){
    deleteCustomProduct(parseInt(delBtn.dataset.sr, 10));
    return;
  }
  // tapping the row content while a delete button is showing closes it
  // instead of also triggering whatever is underneath
  const openEl = document.querySelector('.swipe-content.open');
  if(openEl && !e.target.closest('.swipe-delete-bg')){
    e.preventDefault();
    closeAllSwipes(null);
  }
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.swipe-wrap')) closeAllSwipes(null);
});

/* ============================= ORDER / DISCOUNT / TICKET ============================= */

function orderLines(){
  return Object.keys(state.order)
    .map(sr => parseInt(sr,10))
    .map(sr => ({sr, qty: state.order[sr], product: CATALOG[sr]}))
    .filter(l => l.product)
    .sort((a,b) => a.sr - b.sr);
}

function computeTotals(){
  const lines = orderLines();
  let subtotal = 0;
  let itemCount = 0;
  let unpriced = 0;
  lines.forEach(l => {
    itemCount += l.qty;
    const price = l.product.price;
    if(price === null || price === undefined){ unpriced += 1; }
    else { subtotal += price * l.qty; }
  });
  let discountAmount = 0;
  if(state.discount.value > 0){
    if(state.discount.type === 'percent'){
      discountAmount = subtotal * (state.discount.value / 100);
    } else {
      discountAmount = state.discount.value;
    }
  }
  discountAmount = Math.max(0, Math.min(discountAmount, subtotal));
  const total = subtotal - discountAmount;
  return {lines, subtotal, discountAmount, total, itemCount, unpriced};
}

function ticketHtml(){
  const {lines, subtotal, discountAmount, total, itemCount, unpriced} = computeTotals();

  const linesHtml = lines.length === 0
    ? `<div class="ticket-empty">No items yet.<br>Use the +/− steppers to add products from the price list.</div>`
    : lines.map(l => {
        const { sr, name, price, unit } = l.product;
        const lineTotal = (price === null || price === undefined) ? null : price * l.qty;
        return `
          <div class="ticket-line">
            <div class="tl-main">
              <div class="tl-name">${escapeHtml(name)}</div>
              <div class="tl-meta">#${fmtSr(sr)} · ${price===null?'no price':fmtMoney(price)} × ${l.qty} ${escapeHtml(unit)}</div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:2px;">
              <div class="tl-total">${lineTotal===null?'—':fmtMoney(lineTotal)}</div>
              <button class="tl-remove" onclick="setQty(${sr},0)" aria-label="Remove">×</button>
            </div>
          </div>`;
      }).join('');

  const unpricedNote = unpriced > 0
    ? `<div class="ticket-note">${unpriced} item${unpriced===1?'':'s'} in this order ${unpriced===1?'has':'have'} no listed price and ${unpriced===1?'is':'are'} excluded from the total.</div>`
    : '';

  return `
    <div class="ticket-top">
      <h2>ORDER TICKET</h2>
      <span class="count mono">${itemCount} item${itemCount===1?'':'s'}</span>
    </div>
    <div class="shop-name-row">
      <label for="shopNameInput">Shop / Customer Name</label>
      <input type="text" id="shopNameInput" value="${escapeHtml(state.shopName || '')}" oninput="setShopName(this.value)" placeholder="e.g. Silva Hardware, Kandy">
    </div>
    <div class="ticket-lines">${linesHtml}</div>
    <div class="ticket-summary">
      <div class="sum-row"><span>Subtotal</span><span class="mono">${fmtMoney(subtotal)}</span></div>
      <div class="sum-row discount-row">
        <span>Discount</span>
        <span style="display:flex;align-items:center;gap:4px;">
          <input type="number" id="discountValue" min="0" step="0.01" value="${state.discount.value || 0}" onchange="setDiscountValue(this.value)">
          <select id="discountType" onchange="setDiscountType(this.value)">
            <option value="percent" ${state.discount.type==='percent'?'selected':''}>%</option>
            <option value="flat" ${state.discount.type==='flat'?'selected':''}>Rs</option>
          </select>
        </span>
      </div>
      ${discountAmount>0 ? `<div class="sum-row"><span>Discount applied</span><span class="mono">− ${fmtMoney(discountAmount)}</span></div>` : ''}
      <div class="sum-row total"><span>Total</span><span class="mono">${fmtMoney(total)}</span></div>
      ${unpricedNote}
    </div>
    <div class="ticket-actions">
      <button onclick="copyOrder()">Copy</button>
      <button onclick="downloadInvoice()">Download</button>
      <button class="complete full" onclick="completeOrder()">Complete Order &#10003;</button>
    </div>
    <div class="clear-row"><button onclick="clearOrder()">Clear entire order (without saving)</button></div>
  `;
}

function renderTicket(){
  const html = ticketHtml();
  document.getElementById('ticketDesktop').innerHTML = html;
  document.getElementById('ticketMobile').innerHTML = html;
}

function setDiscountValue(v){
  const num = Math.max(0, parseFloat(v) || 0);
  state.discount.value = num;
  saveDiscount();
  renderTicket();
  updateMobileBar();
}
function setDiscountType(t){
  state.discount.type = (t === 'flat') ? 'flat' : 'percent';
  saveDiscount();
  renderTicket();
  updateMobileBar();
}

function setShopName(v){
  // Deliberately does NOT re-render the ticket, so the input never loses
  // focus/cursor position while typing.
  state.shopName = v;
  saveShopName();
}

function updateMobileBar(){
  const {total, itemCount} = computeTotals();
  const bar = document.getElementById('mobileBar');
  bar.classList.toggle('visible', itemCount > 0);
  document.getElementById('mtbCount').textContent = itemCount;
  document.getElementById('mtbTotal').textContent = fmtMoney(total);
}

function clearOrder(){
  if(Object.keys(state.order).length === 0) return;
  showConfirm('Clear all items from the current order? This will NOT be saved to the report.', () => {
    state.order = {};
    state.discount = { type: 'percent', value: 0 };
    state.shopName = '';
    saveOrder();
    saveDiscount();
    saveShopName();
    renderResults();
    renderTicket();
    updateMobileBar();
    flashMessage('Order cleared');
  });
}

function completeOrder(){
  const {lines, subtotal, discountAmount, total, itemCount, unpriced} = computeTotals();
  if(lines.length === 0){
    flashMessage('Add items to the order first');
    return;
  }
  const shopName = (state.shopName || '').trim();
  if(!shopName){
    flashMessage('Enter a shop / customer name before completing the order');
    return;
  }
  const record = {
    id: Date.now(),
    timestamp: new Date().toISOString(),
    shopName,
    lines: lines.map(l => ({
      sr: l.sr,
      name: l.product.name,
      unit: l.product.unit,
      qty: l.qty,
      price: l.product.price,
      lineTotal: (l.product.price===null||l.product.price===undefined) ? null : l.product.price * l.qty
    })),
    subtotal, discountType: state.discount.type, discountValue: state.discount.value,
    discountAmount, total, itemCount, unpriced
  };
  state.history.unshift(record);
  saveHistory();

  state.order = {};
  state.discount = { type: 'percent', value: 0 };
  state.shopName = '';
  saveOrder();
  saveDiscount();
  saveShopName();
  renderResults();
  renderTicket();
  updateMobileBar();
  flashMessage('Order for ' + shopName + ' completed and saved to Report');
  closeSheet();
}

/* ============================= COPY / PDF ============================= */

function buildOrderText(){
  const {lines, subtotal, discountAmount, total, unpriced} = computeTotals();
  if(lines.length === 0) return 'No items in order.';
  const rows = lines.map(l => {
    const { sr, name, price, unit } = l.product;
    const lineTotal = (price===null||price===undefined) ? '-' : (price * l.qty).toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2});
    const unitPrice = (price===null||price===undefined) ? '-' : price.toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2});
    return `#${fmtSr(sr)}  ${name}  x${l.qty} ${unit}  @ ${unitPrice}  = ${lineTotal}`;
  });
  const out = [
    'MBM (PVT) LTD — Order Ticket',
    new Date().toLocaleString(),
    state.shopName && state.shopName.trim() ? 'Shop: ' + state.shopName.trim() : null,
    '--------------------------------------',
    ...rows,
    '--------------------------------------',
    `Subtotal: Rs ${subtotal.toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2})}`
  ].filter(Boolean);
  if(discountAmount > 0){
    out.push(`Discount: - Rs ${discountAmount.toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2})}`);
  }
  out.push(`TOTAL: Rs ${total.toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2})}`);
  if(unpriced > 0){
    out.push(`(${unpriced} item(s) excluded — no listed price)`);
  }
  return out.join('\n');
}

function copyOrder(){
  const text = buildOrderText();
  copyTextToClipboard(text);
}

function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(()=>{
        flashMessage('Order copied to clipboard');
      }).catch(()=>{
        legacyCopy(text);
      });
      return;
    }
  }catch(e){ /* fall through */ }
  legacyCopy(text);
}

function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){ flashMessage('Order copied to clipboard'); }
    else { showCopyFallback(text); }
  }catch(e){
    showCopyFallback(text);
  }
}

function showCopyFallback(text){
  let overlay = document.getElementById('copyFallbackOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'copyFallbackOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,31,34,0.55);z-index:220;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div style="background:#FFFFFF;border-radius:6px;max-width:420px;width:100%;padding:20px;font-family:Archivo,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.3);">
        <p style="margin:0 0 10px 0;font-size:0.9rem;color:#1C1F22;font-weight:700;">Couldn't copy automatically</p>
        <p style="margin:0 0 10px 0;font-size:0.8rem;color:#48586B;">Tap inside the box, select all, and copy manually:</p>
        <textarea id="copyFallbackText" readonly style="width:100%;height:160px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;padding:10px;border:1px solid #CFCBC1;border-radius:3px;resize:vertical;"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:12px;">
          <button id="copyFallbackClose" style="font-family:Archivo,sans-serif;font-weight:700;font-size:0.82rem;padding:9px 14px;border-radius:3px;cursor:pointer;border:2px solid #1C1F22;background:#F2B705;color:#1C1F22;">Done</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('copyFallbackClose').onclick = () => { overlay.style.display = 'none'; };
  }
  document.getElementById('copyFallbackText').value = text;
  overlay.style.display = 'flex';
  const ta = document.getElementById('copyFallbackText');
  ta.focus();
  ta.select();
}

function downloadInvoice(){
  const {lines, subtotal, discountAmount, total, unpriced} = computeTotals();
  if(lines.length === 0){
    flashMessage('Add items to the order before downloading an invoice');
    return;
  }
  if(!window.jspdf || !window.jspdf.jsPDF){
    flashMessage('PDF library did not load — check your internet connection');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('MBM (PVT) LTD', 14, 18);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(90);
  doc.text('Order Invoice', 14, 25);
  doc.text(new Date().toLocaleString(), 14, 30);
  let headerY = 30;
  const shopNameTrimmed = (state.shopName || '').trim();
  if(shopNameTrimmed){
    headerY += 6;
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(0);
    doc.text('Shop: ' + shopNameTrimmed, 14, headerY);
  }
  doc.setTextColor(0);

  const body = lines.map(l => {
    const { sr, name, price, unit } = l.product;
    const unitPrice = (price===null||price===undefined) ? '—' : price.toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2});
    const lineTotal = (price===null||price===undefined) ? '—' : (price * l.qty).toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2});
    return [fmtSr(sr), name, String(l.qty), unit, unitPrice, lineTotal];
  });

  doc.autoTable({
    startY: headerY + 6,
    head: [['Sr#', 'Product', 'Qty', 'Unit', 'Unit Price', 'Total']],
    body: body,
    styles: { fontSize: 9, cellPadding: 3 },
    headStyles: { fillColor: [28, 31, 34], textColor: [242, 183, 5] },
    columnStyles: {
      0: { cellWidth: 16 },
      2: { cellWidth: 12, halign: 'center' },
      3: { cellWidth: 16, halign: 'center' },
      4: { cellWidth: 24, halign: 'right' },
      5: { cellWidth: 24, halign: 'right' }
    },
    margin: { left: 14, right: 14 }
  });

  let y = doc.lastAutoTable.finalY + 8;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text('Subtotal: ' + fmtMoney(subtotal), 196, y, { align: 'right' });
  if(discountAmount > 0){
    y += 6;
    doc.text('Discount: - ' + fmtMoney(discountAmount), 196, y, { align: 'right' });
  }
  y += 8;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('TOTAL: ' + fmtMoney(total), 196, y, { align: 'right' });

  if(unpriced > 0){
    y += 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(unpriced + ' item(s) excluded — no listed price.', 14, y);
    doc.setTextColor(0);
  }

  const filename = 'MBM-Invoice-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.pdf';
  doc.save(filename);
  flashMessage('Invoice downloaded');
}

/* ============================= ADD / EDIT PRODUCT ============================= */

function openProductModal(sr){
  state.editingSr = sr || null;
  const overlay = document.getElementById('productModalOverlay');
  const title = document.getElementById('productModalTitle');
  const nameEl = document.getElementById('pmName');
  const priceEl = document.getElementById('pmPrice');
  const buyRateEl = document.getElementById('pmBuyRate');
  const unitEl = document.getElementById('pmUnit');
  const unitOtherEl = document.getElementById('pmUnitOther');
  const leftActions = document.getElementById('pmLeftActions');
  leftActions.innerHTML = '';

  if(sr){
    const item = CATALOG[sr];
    title.textContent = 'Edit Product #' + fmtSr(sr);
    nameEl.value = item.name;
    priceEl.value = (item.price===null||item.price===undefined) ? '' : item.price;
    buyRateEl.value = (item.buyRate===null||item.buyRate===undefined) ? '' : item.buyRate;
    setUnitSelect(item.unit);

    if(item.custom){
      const delBtn = document.createElement('button');
      delBtn.className = 'btn danger';
      delBtn.textContent = 'Delete product';
      delBtn.onclick = () => deleteCustomProduct(sr);
      leftActions.appendChild(delBtn);
    } else if(state.overrides[sr]){
      const resetBtn = document.createElement('button');
      resetBtn.className = 'btn';
      resetBtn.textContent = 'Reset to default';
      resetBtn.onclick = () => resetOverride(sr);
      leftActions.appendChild(resetBtn);
    }
  } else {
    title.textContent = 'Add Product';
    nameEl.value = '';
    priceEl.value = '';
    buyRateEl.value = '';
    setUnitSelect('Pcs');
  }

  overlay.classList.add('open');
  nameEl.focus();
}

function setUnitSelect(unit){
  const unitEl = document.getElementById('pmUnit');
  const unitOtherEl = document.getElementById('pmUnitOther');
  const known = Array.from(unitEl.options).some(o => o.value === unit);
  if(known){
    unitEl.value = unit;
    unitOtherEl.style.display = 'none';
    unitOtherEl.value = '';
  } else {
    unitEl.value = '__other__';
    unitOtherEl.style.display = 'block';
    unitOtherEl.value = unit;
  }
}

function closeProductModal(){
  document.getElementById('productModalOverlay').classList.remove('open');
  state.editingSr = null;
}

function saveProductModal(){
  const name = document.getElementById('pmName').value.trim();
  const priceRaw = document.getElementById('pmPrice').value;
  const buyRateRaw = document.getElementById('pmBuyRate').value;
  const unitSel = document.getElementById('pmUnit').value;
  const unitOther = document.getElementById('pmUnitOther').value.trim();
  const unit = (unitSel === '__other__') ? (unitOther || 'Pcs') : unitSel;

  if(!name){
    flashMessage('Product name is required');
    return;
  }
  if(priceRaw === '' || isNaN(parseFloat(priceRaw))){
    flashMessage('Enter a valid sale rate');
    return;
  }
  const price = parseFloat(priceRaw);
  const buyRate = (buyRateRaw === '' || isNaN(parseFloat(buyRateRaw))) ? null : parseFloat(buyRateRaw);

  if(state.editingSr){
    const sr = state.editingSr;
    const existing = CATALOG[sr];
    if(existing.custom){
      const idx = state.customProducts.findIndex(cp => cp.sr === sr);
      if(idx >= 0){
        state.customProducts[idx] = { sr, name, price, buyRate, unit };
        saveCustomProducts();
      }
    } else {
      state.overrides[sr] = { price, buyRate, unit };
      saveOverrides();
    }
    flashMessage('Product updated');
  } else {
    const sr = nextCustomSr++;
    state.customProducts.push({ sr, name, price, buyRate, unit });
    saveCustomProducts();
    flashMessage('Product added');
    searchInput.value = name;
  }

  rebuildCatalog();
  closeProductModal();
  renderResults();
  renderTicket();
}

function deleteCustomProduct(sr){
  showConfirm('Delete this product? This cannot be undone.', () => {
    state.customProducts = state.customProducts.filter(cp => cp.sr !== sr);
    saveCustomProducts();
    delete state.order[sr];
    saveOrder();
    rebuildCatalog();
    closeProductModal();
    renderResults();
    renderTicket();
    updateMobileBar();
    flashMessage('Product deleted');
  });
}

function resetOverride(sr){
  delete state.overrides[sr];
  saveOverrides();
  rebuildCatalog();
  closeProductModal();
  renderResults();
  flashMessage('Reset to default price list values');
}

/* ============================= REPORT ============================= */

function openReport(){
  renderReport();
  document.getElementById('reportModalOverlay').classList.add('open');
}
function closeReport(){
  document.getElementById('reportModalOverlay').classList.remove('open');
}

function renderReport(){
  const bar = document.getElementById('reportSummaryBar');
  const list = document.getElementById('reportList');
  const filterVal = (document.getElementById('reportShopFilter').value || '').trim().toLowerCase();

  if(state.history.length === 0){
    bar.innerHTML = '';
    list.innerHTML = `<div class="report-empty">No completed orders yet. Orders are saved here when you tap "Complete Order" on the ticket.</div>`;
    return;
  }

  const filtered = filterVal
    ? state.history.filter(r => (r.shopName || '').toLowerCase().includes(filterVal))
    : state.history;

  if(filtered.length === 0){
    bar.innerHTML = `<div>0 of <b>${state.history.length}</b> orders match that shop name</div>`;
    list.innerHTML = `<div class="report-empty">No orders found for that shop / customer name.</div>`;
    return;
  }

  const totalRevenue = filtered.reduce((s,r) => s + r.total, 0);
  bar.innerHTML = `
    <div><b>${filtered.length}</b>${filtered.length!==state.history.length ? ' of '+state.history.length : ''} saved order${filtered.length===1?'':'s'}</div>
    <div>Total: <b>${fmtMoney(totalRevenue)}</b></div>
    <div style="margin-left:auto;display:flex;gap:8px;">
      <button class="btn" style="padding:5px 10px;font-size:0.72rem;" onclick="downloadReportPdf()">Download Report</button>
      <button class="btn danger" style="padding:5px 10px;font-size:0.72rem;" onclick="clearHistory()">Clear all report history</button>
    </div>
  `;

  list.innerHTML = filtered.map(r => {
    const dateStr = new Date(r.timestamp).toLocaleString();
    const linesHtml = r.lines.map(l => `
      <div class="re-line">
        <div class="re-line-name">#${fmtSr(l.sr)} ${escapeHtml(l.name)}</div>
        <div class="re-line-meta">${l.qty} ${escapeHtml(l.unit)} × ${l.price===null?'—':fmtMoney(l.price)} = ${l.lineTotal===null?'—':fmtMoney(l.lineTotal)}</div>
      </div>`).join('');
    const discountLine = r.discountAmount > 0
      ? `<div class="re-line"><div class="re-line-name">Discount</div><div class="re-line-meta">− ${fmtMoney(r.discountAmount)}</div></div>`
      : '';
    return `
      <div class="report-entry" id="report-entry-${r.id}">
        <div class="report-entry-head" onclick="toggleReportEntry(${r.id})">
          <div>
            <div class="re-date">${escapeHtml(r.shopName || 'Unnamed order')}</div>
            <div class="re-meta">${dateStr} · ${r.itemCount} item${r.itemCount===1?'':'s'}${r.unpriced>0 ? ' · '+r.unpriced+' unpriced' : ''}</div>
          </div>
          <div class="re-total mono">${fmtMoney(r.total)}</div>
        </div>
        <div class="report-entry-body">
          ${linesHtml}
          ${discountLine}
        </div>
      </div>`;
  }).join('');
}

function toggleReportEntry(id){
  const el = document.getElementById('report-entry-' + id);
  if(el) el.classList.toggle('expanded');
}

function clearHistory(){
  if(state.history.length === 0) return;
  showConfirm('Clear all saved order report history? This cannot be undone.', () => {
    state.history = [];
    saveHistory();
    renderReport();
    flashMessage('Report history cleared');
  });
}

function downloadReportPdf(){
  if(state.history.length === 0){
    flashMessage('No saved orders to download yet');
    return;
  }
  if(!window.jspdf || !window.jspdf.jsPDF){
    flashMessage('PDF library did not load — check your internet connection');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('MBM (PVT) LTD', 14, 18);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(90);
  doc.text('Order Report — all saved orders', 14, 25);
  doc.text('Generated ' + new Date().toLocaleString(), 14, 30);
  doc.setTextColor(0);

  // oldest to newest, one row per line item, with an order-total row after each order
  const chronological = state.history.slice().reverse();
  const body = [];
  chronological.forEach(r => {
    const dateStr = new Date(r.timestamp).toLocaleString();
    const shop = r.shopName || '—';
    r.lines.forEach(l => {
      body.push([
        dateStr,
        shop,
        fmtSr(l.sr),
        l.name,
        String(l.qty),
        l.unit,
        l.price===null ? '—' : fmtMoney(l.price),
        l.lineTotal===null ? '—' : fmtMoney(l.lineTotal)
      ]);
    });
    if(r.discountAmount > 0){
      body.push([dateStr, shop, '', 'Discount', '', '', '', '- ' + fmtMoney(r.discountAmount)]);
    }
    body.push([dateStr, shop, '', 'ORDER TOTAL', '', '', '', fmtMoney(r.total)]);
  });

  doc.autoTable({
    startY: 36,
    head: [['Date/Time', 'Shop', 'Sr#', 'Product', 'Qty', 'Unit', 'Unit Price', 'Total']],
    body: body,
    styles: { fontSize: 7.5, cellPadding: 2.5 },
    headStyles: { fillColor: [28, 31, 34], textColor: [242, 183, 5] },
    columnStyles: {
      0: { cellWidth: 26 },
      1: { cellWidth: 26 },
      2: { cellWidth: 12 },
      4: { cellWidth: 10, halign: 'center' },
      5: { cellWidth: 12, halign: 'center' },
      6: { cellWidth: 20, halign: 'right' },
      7: { cellWidth: 20, halign: 'right' }
    },
    margin: { left: 8, right: 8 },
    didParseCell: function(data){
      if(data.row.raw[3] === 'ORDER TOTAL' || data.row.raw[3] === 'Discount'){
        data.cell.styles.fontStyle = 'bold';
      }
    }
  });

  const grandTotal = state.history.reduce((s,r) => s + r.total, 0);
  const finalY = doc.lastAutoTable.finalY + 10;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('GRAND TOTAL — ' + state.history.length + ' order(s): ' + fmtMoney(grandTotal), 200, finalY, { align: 'right' });

  const filename = 'MBM-Order-Report-' + new Date().toISOString().slice(0,10) + '.pdf';
  doc.save(filename);
  flashMessage('Report downloaded');
}

/* ============================= DAILY SUMMARY ============================= */

function todayDateKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function localDateKey(iso){
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function computeDailySummary(dateKey){
  const orders = state.history.filter(r => localDateKey(r.timestamp) === dateKey);
  const productMap = {};
  let revenue = 0;
  orders.forEach(r => {
    revenue += r.total;
    r.lines.forEach(l => {
      if(!productMap[l.sr]){
        productMap[l.sr] = { sr: l.sr, name: l.name, unit: l.unit, qty: 0, revenue: 0 };
      }
      productMap[l.sr].qty += l.qty;
      if(l.lineTotal !== null) productMap[l.sr].revenue += l.lineTotal;
    });
  });
  const products = Object.values(productMap).sort((a,b) => b.qty - a.qty);
  return { orders, products, revenue };
}

function openDailySummary(){
  const dateInput = document.getElementById('dsDate');
  if(!dateInput.value){ dateInput.value = todayDateKey(); }
  renderDailySummary();
  document.getElementById('dailySummaryModalOverlay').classList.add('open');
}
function closeDailySummary(){
  document.getElementById('dailySummaryModalOverlay').classList.remove('open');
}

function renderDailySummary(){
  const dateKey = document.getElementById('dsDate').value || todayDateKey();
  const { orders, products, revenue } = computeDailySummary(dateKey);

  const bar = document.getElementById('dsSummaryBar');
  bar.innerHTML = `
    <div><b>${orders.length}</b> order${orders.length===1?'':'s'}</div>
    <div>Revenue: <b>${fmtMoney(revenue)}</b></div>
    <div>Products sold: <b>${products.length}</b></div>
  `;

  const content = document.getElementById('dsContent');
  if(orders.length === 0){
    content.innerHTML = `<div class="report-empty">No completed orders on this date.</div>`;
    return;
  }

  const orderRows = orders.map(o => `
    <tr>
      <td>${escapeHtml(o.shopName || 'Unnamed order')}</td>
      <td class="num">${new Date(o.timestamp).toLocaleTimeString()}</td>
      <td class="num">${o.itemCount}</td>
      <td class="num">${fmtMoney(o.total)}</td>
    </tr>`).join('');

  const rows = products.map(p => `
    <tr>
      <td>${escapeHtml(p.name)}</td>
      <td class="num">${p.qty}</td>
      <td class="num">${escapeHtml(p.unit)}</td>
      <td class="num">${fmtMoney(p.revenue)}</td>
    </tr>`).join('');

  content.innerHTML = `
    <h4 style="margin:14px 0 4px 0;font-size:0.8rem;color:var(--steel);">Orders on this date</h4>
    <table class="ds-table">
      <thead><tr><th>Shop / Customer</th><th style="text-align:right;">Time</th><th style="text-align:right;">Items</th><th style="text-align:right;">Total</th></tr></thead>
      <tbody>${orderRows}</tbody>
    </table>
    <h4 style="margin:18px 0 4px 0;font-size:0.8rem;color:var(--steel);">Total quantity sold, by product</h4>
    <table class="ds-table">
      <thead><tr><th>Product</th><th style="text-align:right;">Qty Sold</th><th style="text-align:right;">Unit</th><th style="text-align:right;">Revenue</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function downloadDailySummaryPdf(){
  const dateKey = document.getElementById('dsDate').value || todayDateKey();
  const { orders, products, revenue } = computeDailySummary(dateKey);
  if(orders.length === 0){
    flashMessage('No orders on this date to download');
    return;
  }
  if(!window.jspdf || !window.jspdf.jsPDF){
    flashMessage('PDF library did not load — check your internet connection');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('MBM (PVT) LTD', 14, 18);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(90);
  doc.text('Daily Summary — ' + dateKey, 14, 25);
  doc.text(orders.length + ' order(s) · Revenue ' + fmtMoney(revenue), 14, 30);
  doc.setTextColor(0);

  const body = products.map(p => [p.name, String(p.qty), p.unit, fmtMoney(p.revenue)]);

  doc.autoTable({
    startY: 36,
    head: [['Product', 'Qty Sold', 'Unit', 'Revenue']],
    body: body,
    styles: { fontSize: 9, cellPadding: 3 },
    headStyles: { fillColor: [28, 31, 34], textColor: [242, 183, 5] },
    columnStyles: {
      1: { halign: 'right' },
      2: { halign: 'center' },
      3: { halign: 'right' }
    },
    margin: { left: 14, right: 14 }
  });

  const filename = 'MBM-Daily-Summary-' + dateKey + '.pdf';
  doc.save(filename);
  flashMessage('Daily summary downloaded');
}

/* ============================= CONFIRM DIALOG ============================= */

function showConfirm(message, onConfirm){
  let overlay = document.getElementById('confirmOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'confirmOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,31,34,0.55);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div style="background:#FFFFFF;border-radius:6px;max-width:340px;width:100%;padding:20px;font-family:Archivo,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.3);">
        <p id="confirmMsg" style="margin:0 0 18px 0;font-size:0.95rem;color:#1C1F22;font-weight:600;line-height:1.4;"></p>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button id="confirmCancelBtn" style="font-family:Archivo,sans-serif;font-weight:700;font-size:0.82rem;padding:9px 14px;border-radius:3px;cursor:pointer;border:2px solid #1C1F22;background:#FFFFFF;color:#1C1F22;">Cancel</button>
          <button id="confirmOkBtn" style="font-family:Archivo,sans-serif;font-weight:700;font-size:0.82rem;padding:9px 14px;border-radius:3px;cursor:pointer;border:2px solid #C1432A;background:#C1432A;color:#FFFFFF;">Confirm</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  }
  document.getElementById('confirmMsg').textContent = message;
  overlay.style.display = 'flex';

  const cancelBtn = document.getElementById('confirmCancelBtn');
  const okBtn = document.getElementById('confirmOkBtn');
  const cleanup = () => { overlay.style.display = 'none'; };
  cancelBtn.onclick = cleanup;
  overlay.onclick = (e) => { if(e.target === overlay) cleanup(); };
  okBtn.onclick = () => { cleanup(); onConfirm(); };
}

/* ============================= MISC UI ============================= */

let flashTimer;
function flashMessage(msg){
  let el = document.getElementById('flashMsg');
  if(!el){
    el = document.createElement('div');
    el.id = 'flashMsg';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1F22;color:#F2B705;padding:10px 18px;border-radius:4px;font-family:Archivo,sans-serif;font-weight:700;font-size:0.85rem;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,.25);';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 1800);
}

let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderResults, 90);
});

document.getElementById('mtbOpenBtn').addEventListener('click', () => {
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetOverlay').classList.add('open');
});

}

document.getElementById('dailySummaryModalClose').addEventListener('click', closeDailySummary);

document.getElementById('dailySummaryModalOverlay').addEventListener('click', (e) => {

});

/* ============================= INIT ============================= */

loadAll();
rebuildCatalog();
renderResults();
renderTicket();
updateMobileBar();
searchInput.focus();
</script>
